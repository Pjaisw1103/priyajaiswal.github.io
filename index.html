<script type="x-shader/x-vertex" id="vertexshader">
attribute float size;
attribute vec3 customColor;
varying vec3 vColor;
void main() {
  vColor = customColor;
  vec4 mvPosition = modelViewMatrix * vec4( position, 1.0 );
  gl_PointSize = size * ( 300.0 / -mvPosition.z );
  gl_Position = projectionMatrix * mvPosition;
}
</script>
<script type="x-shader/x-fragment" id="fragmentshader">
uniform vec3 color;
uniform sampler2D pointTexture;
varying vec3 vColor;
void main() {
  gl_FragColor = vec4( color * vColor, 1.0 );
  gl_FragColor = gl_FragColor * texture2D( pointTexture, gl_PointCoord );
}
</script>

<style>
  :root{ --gold:#ffc200; --gold-dim:rgba(255,194,0,.4); --bg:#000000; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--bg); overflow:hidden; }
  @media (pointer:fine){
    .hero, .hero *{ cursor:none; }
  }

  /* SIMPLE SLEEK GOLD CURSOR */
  .cursor-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);position:fixed;pointer-events:none;z-index:999998;transform:translate(-50%,-50%);transition:width .2s,height .2s,background .2s;box-shadow:0 0 10px rgba(255,194,0,.6)}
  .cursor-ring{width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,194,0,.5);position:fixed;pointer-events:none;z-index:999997;transform:translate(-50%,-50%);transition:width .2s,height .2s,border-color .2s}
  .cursor-dot.hovered{width:12px;height:12px;background:#fff}
  .cursor-ring.hovered{width:48px;height:48px;border-color:var(--gold)}

  .hero{ position:relative; width:100%; height:100vh; overflow:hidden; background:var(--bg); }

  /* static background watermark text */
  .bg-watermark{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    z-index:0; pointer-events:none; user-select:none; white-space:nowrap;
    font-family:'Archivo Black', sans-serif; text-transform:uppercase;
    font-size:clamp(3.5rem, 21vw, 17rem); letter-spacing:.02em;
    background:
      linear-gradient(100deg, transparent 30%, rgba(255,230,150,.55) 48%, transparent 66%),
      linear-gradient(180deg, rgba(255,194,0,.30) 0%, rgba(255,194,0,.08) 55%, rgba(0,0,0,0) 100%);
    background-size:260% 100%, 100% 100%;
    background-position:120% 0, 0 0;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:watermarkSweep 9s ease-in-out infinite;
  }
  @keyframes watermarkSweep{
    0%{ background-position:120% 0, 0 0; }
    50%{ background-position:-20% 0, 0 0; }
    100%{ background-position:120% 0, 0 0; }
  }

  #particles{ position:absolute; inset:0; z-index:1; touch-action:none; }

  .enter-btn-wrap{
    position:absolute; bottom:13%; left:0; right:0; z-index:2;
    display:flex; justify-content:center;
    opacity:0; transform:translateY(14px); pointer-events:none;
    transition:opacity .6s ease, transform .6s ease;
  }
  .enter-btn-wrap.show{ opacity:1; transform:translateY(0); pointer-events:auto; }

  .enter-btn{
    background:transparent; border:2px solid var(--gold); color:var(--gold);
    padding:14px 36px; border-radius:50px; cursor:pointer;
    font-family:'Courier New', monospace; letter-spacing:.16em; text-transform:uppercase;
    font-size:.82rem; display:inline-flex; align-items:center; gap:12px;
    text-decoration:none!important;
    transition:background .25s ease, color .25s ease, box-shadow .25s ease, transform .2s ease;
  }
  .enter-btn:hover{ background:var(--gold); color:#000!important; box-shadow:0 0 28px rgba(255,194,0,.4); transform:translateY(-2px); }
  .enter-btn:active{ transform:translateY(0); }
  .enter-btn .arrow{ transition:transform .25s ease; font-size:1rem; }
  .enter-btn:hover .arrow{ transform:translateX(5px); }

  @media (prefers-reduced-motion: reduce){
    .enter-btn-wrap{ transition:none; }
    .bg-watermark{ animation:none; background-position:0 0, 0 0; }
  }

<body>

<div class="cursor-dot" id="cursorDot"></div>
<div class="cursor-ring" id="cursorRing"></div>

<section class="hero" id="hero">
  <div class="bg-watermark" aria-hidden="true">PRIYA</div>
  <div id="particles" role="img" aria-label="Priya Jaiswal — Azure Cloud & DevOps Engineer"></div>
  <div class="enter-btn-wrap show" id="enterBtnWrap">
    <a id="enterBtn" class="enter-btn" href="home.html">Enter the World <span class="arrow" aria-hidden="true">&rarr;</span></a>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* Simple Gold Reticle cursor following */
const dot = document.getElementById('cursorDot');
const ring = document.getElementById('cursorRing');
let mouseX = window.innerWidth/2, mouseY = window.innerHeight/2;
let ringX = mouseX, ringY = mouseY;

window.addEventListener('pointermove', (e) => {
  mouseX = e.clientX; mouseY = e.clientY;
  if (dot) {
    dot.style.left = mouseX + 'px';
    dot.style.top = mouseY + 'px';
  }
});

function animateRing() {
  ringX += (mouseX - ringX) * 0.2;
  ringY += (mouseY - ringY) * 0.2;
  if (ring) {
    ring.style.left = ringX + 'px';
    ring.style.top = ringY + 'px';
  }
  requestAnimationFrame(animateRing);
}
animateRing();

const enterBtn = document.getElementById('enterBtn');
if (enterBtn) {
  enterBtn.addEventListener('mouseenter', () => {
    if (dot) dot.classList.add('hovered');
    if (ring) ring.classList.add('hovered');
  });
  enterBtn.addEventListener('mouseleave', () => {
    if (dot) dot.classList.remove('hovered');
    if (ring) ring.classList.remove('hovered');
  });
}

/* Particle canvas text for Priya Jaiswal */
const canvas = document.createElement('canvas');
const container = document.getElementById('particles');
if (container) {
  container.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const dots = [];
  const numDots = Math.min(Math.floor(window.innerWidth / 12), 90);

  for (let i = 0; i < numDots; i++) {
    dots.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      vx: (Math.random() - 0.5) * 0.8,
      vy: (Math.random() - 0.5) * 0.8,
      radius: Math.random() * 2 + 1,
      color: "#ffc200"
    });
  }

  function renderParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Render centered title text
    ctx.font = `900 ${Math.min(canvas.width / 14, 52)}px 'Maven Pro', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffc200';
    ctx.shadowBlur = 20;
    ctx.shadowColor = 'rgba(255, 194, 0, 0.65)';
    ctx.fillText("Priya Jaiswal", canvas.width / 2, canvas.height / 2 - 25);
    
    ctx.font = `600 ${Math.min(canvas.width / 30, 22)}px 'Maven Pro', sans-serif`;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
    ctx.shadowBlur = 12;
    ctx.shadowColor = 'rgba(255, 255, 255, 0.4)';
    ctx.fillText("Azure Cloud · DevOps · DevSecOps Engineer", canvas.width / 2, canvas.height / 2 + 30);
    ctx.shadowBlur = 0;

    dots.forEach((p, idx) => {
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
      if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();

      for (let j = idx + 1; j < dots.length; j++) {
        const dx = p.x - dots[j].x;
        const dy = p.y - dots[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 125) {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(dots[j].x, dots[j].y);
          ctx.strokeStyle = `rgba(255, 194, 0, ${0.28 * (1 - dist / 125)})`;
          ctx.lineWidth = 0.8;
          ctx.stroke();
        }
      }
    });

    requestAnimationFrame(renderParticles);
  }
  renderParticles();
}
</script>
